apply plugin: 'com.android.application'

android {
    namespace 'com.shuili.ganzhi'
    compileSdk 34

    // 发布签名（密钥零入库）：keystore 与口令文件一律在仓库外（如 tools\keystore\），
    // 定位顺序：环境变量 SHUILI_KEYSTORE_PROPS 指向的 properties → 工程根 keystore.properties（本地件）。
    // 两者都不存在时自动降级 debug 签名（仍为 release APK），保证公开库贡献者可直接构建。
    def ksPropsFile = null
    def envProps = System.getenv('SHUILI_KEYSTORE_PROPS')
    if (envProps != null && file(envProps).exists()) {
        ksPropsFile = file(envProps)
    } else if (file('keystore.properties').exists()) {
        ksPropsFile = file('keystore.properties')
    }

    signingConfigs {
        if (ksPropsFile != null) {
            def ks = new Properties()
            ksPropsFile.withInputStream { ks.load(it) }
            release {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId 'com.shuili.ganzhi'
        minSdk 24
        targetSdk 34
        versionCode 76
        versionName '1.76'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 本地有发布 keystore 则用其签名，否则用 debug 签名（公开库默认路径）
            def rc = signingConfigs.findByName('release')
            signingConfig rc != null ? rc : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
